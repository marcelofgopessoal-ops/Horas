<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Horas Extra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:24px 18px 18px;border-radius:0 0 22px 22px}
h1{margin:0;font-size:26px}header p{margin:5px 0 0;color:#d1d5db}
main{max-width:650px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{font-size:13px;font-weight:600;color:#4b5563;display:block;margin-bottom:5px}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;font-size:16px}
button{border:0;border-radius:12px;padding:13px 15px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white;width:100%;margin-top:12px}.danger{background:#fee2e2;color:#991b1b}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f9fafb;border-radius:14px;padding:13px}.stat b{font-size:21px;display:block}.muted{color:#6b7280;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.small{font-size:13px}.extra{font-weight:800}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}
@media(max-width:430px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><h1>⏱️ Horas Extra</h1><p>Regista o teu horário e acompanha as horas extra.</p></header>
<main>
<div class="card">
<h2>Registar dia</h2>
<div class="grid">
<div><label>Data</label><input id="date" type="date"></div>
<div><label>Valor hora extra (€)</label><input id="rate" type="number" step="0.01" min="0" value="12"></div>
<div><label>Entrada</label><input id="in" type="time" value="08:00"></div>
<div><label>Saída</label><input id="out" type="time" value="17:00"></div>
<div><label>Pausa (minutos)</label><input id="break" type="number" min="0" value="60"></div>
<div><label>Horas normais</label><input id="normal" type="number" step="0.25" min="0" value="8"></div>
</div>
<button class="primary" onclick="addDay()">Adicionar dia</button>
</div>

<div class="card">
<h2>Resumo</h2>
<div class="stats">
<div class="stat"><span class="muted">Horas trabalhadas</span><b id="worked">0h 00m</b></div>
<div class="stat"><span class="muted">Horas extra</span><b id="extra">0h 00m</b></div>
<div class="stat"><span class="muted">Valor estimado</span><b id="money">0,00 €</b></div>
<div class="stat"><span class="muted">Dias registados</span><b id="days">0</b></div>
</div>
</div>

<div class="card">
<h2>Registos</h2>
<div id="list"></div>
<div class="actions">
<button onclick="saveData()">💾 Guardar</button>
<button onclick="exportCSV()">Exportar</button>
<button class="danger" onclick="clearAll()">Apagar tudo</button>
</div>
</div>
</main>
<script>
const KEY="horas_extra_v4";
const SETTINGS_KEY="horas_extra_settings_v4";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{"rate":12,"in":"08:00","out":"17:00"}');
const $=id=>document.getElementById(id);
$("date").value=new Date().toISOString().slice(0,10);
$("rate").value=settings.rate;
$("in").value=settings.in;
$("out").value=settings.out;

function mins(t){let [h,m]=t.split(":").map(Number);return h*60+m}
function fmt(m){m=Math.max(0,Math.round(m));return `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`}
function euro(v){return v.toLocaleString("pt-PT",{style:"currency",currency:"EUR"})}
function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
 localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
 render();
}
function saveData(){
 settings.rate=Number($("rate").value||12);
 settings.in=$("in").value||"08:00";
 settings.out=$("out").value||"17:00";
 localStorage.setItem(KEY,JSON.stringify(data));
 localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
 alert("Guardado com sucesso.");
}
function addDay(){
 let date=$("date").value, a=$("in").value,b=$("out").value;
 if(!date||!a||!b){alert("Preenche a data, entrada e saída.");return}
 let total=mins(b)-mins(a); if(total<0) total+=1440;
 total-=Number($("break").value||0);
 let normal=Number($("normal").value||8)*60;
 let extra=Math.max(0,total-normal);
 let rate=Number($("rate").value||12);
 settings.rate=rate; settings.in=a; settings.out=b;
 localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
 data.push({id:Date.now(),date,in:a,out:b,break:Number($("break").value||0),normal,worked:total,extra,rate});
 data.sort((x,y)=>x.date.localeCompare(y.date));
 save();
}
function render(){
 let worked=data.reduce((s,x)=>s+x.worked,0), extra=data.reduce((s,x)=>s+x.extra,0);
 let money=data.reduce((s,x)=>s+x.extra/60*x.rate,0);
 $("worked").textContent=fmt(worked);$("extra").textContent=fmt(extra);$("money").textContent=euro(money);$("days").textContent=data.length;
 $("list").innerHTML=data.length?data.map(x=>`<div class="row">
 <div><b>${new Date(x.date+"T12:00").toLocaleDateString("pt-PT")}</b><div class="small">${x.in} → ${x.out} · pausa ${x.break}m</div></div>
 <div style="text-align:right"><div class="extra">+${fmt(x.extra)}</div><div class="small">${euro(x.extra/60*x.rate)}</div><button onclick="deleteDay(${x.id})" style="padding:6px 8px;font-size:12px;margin-top:5px">Apagar</button></div>
 </div>`).join(""):"<p class='muted'>Ainda não tens registos.</p>";
}
function deleteDay(id){ data=data.filter(x=>x.id!==id); save(); }
function clearAll(){if(confirm("Apagar todos os registos?")){data=[];save()}}
function exportCSV(){
 if(!data.length){alert("Não há registos para exportar.");return}
 let rows=[["Data","Entrada","Saída","Pausa (min)","Horas trabalhadas","Horas extra","Valor/h extra","Valor extra"]];
 data.forEach(x=>rows.push([x.date,x.in,x.out,x.break,fmt(x.worked),fmt(x.extra),x.rate.toFixed(2),(x.extra/60*x.rate).toFixed(2)]));
 let csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(";")).join("\n");
 let blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="horas-extra.csv";a.click();URL.revokeObjectURL(url);
}
render();
</script>
</body>
</html>
